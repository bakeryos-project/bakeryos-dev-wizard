[package]
name = "BakeryOSDevWizard"
version = "0.1.0"
edition = "2021"

[dependencies]
async-channel = "2.5.0"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.9", package = "gtk4", features = ["gnome_47"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2", features = ["json"] }
gdk-pixbuf = "0.20"
webbrowser = "1.0"

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_6"]
